[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
test-threads = 4

[profile.ci]
inherits = "default"
fail-fast = false
retries = 0

[profile.ordinary]
inherits = "ci"
default-filter = 'not package(=postgres-replicated) and not binary(=kubernetes_checkpoint_real)'

[profile.postgres]
inherits = "ci"
default-filter = 'package(=postgres-replicated)'
test-threads = 1

[profile.kind]
inherits = "ci"
default-filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(adversarial_restart_partition_and_healing_preserve_single_writer|bootstrap_reaches_three_member_topology_and_quorum_write|failover_fences_old_primary_and_preserves_committed_data|planned_switchover(_adversarial)?|quorum_loss_closes_writes_and_recovers_without_data_loss_epoch_change|replacement_preserves_quorum_write_and_retires_old_incarnation|scale_down(_adversarial)?|scale_up(_multi|_adversarial)?)$/)'
test-threads = 1

[profile.dex-live]
inherits = "ci"
default-filter = 'binary(=kubernetes_checkpoint_real)'
test-threads = 1

[profile.helper]
inherits = "ci"
default-filter = 'binary_id(=kuberic-agent::crash_boundaries) or binary_id(=kuberic-protocol::model) or binary_id(=postgres-replicated::native_durable) or binary_id(=postgres-replicated::validation_oracles)'
test-threads = 1

[profile.external]
inherits = "ci"
default-filter = 'binary_id(=sqlserver-replicated::live_observation)'
test-threads = 1

[test-groups]
postgres = { max-threads = 1 }
sqlite = { max-threads = 1 }
process-boundaries = { max-threads = 1 }
kind-live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=postgres-replicated)'
test-group = 'postgres'

[[profile.default.overrides]]
filter = 'package(=sqlite-replicated) or package(=sqlite-commit-barrier)'
test-group = 'sqlite'

[[profile.default.overrides]]
filter = 'binary_id(=kuberic-agent::crash_boundaries)'
test-group = 'process-boundaries'
threads-required = 4

[[profile.default.overrides]]
filter = 'package(=kuberic-level-tests) and test(/^level_triggered_k8s::(adversarial_restart_partition_and_healing_preserve_single_writer|bootstrap_reaches_three_member_topology_and_quorum_write|failover_fences_old_primary_and_preserves_committed_data|planned_switchover(_adversarial)?|quorum_loss_closes_writes_and_recovers_without_data_loss_epoch_change|replacement_preserves_quorum_write_and_retires_old_incarnation|scale_down(_adversarial)?|scale_up(_multi|_adversarial)?)$/)'
test-group = 'kind-live'
