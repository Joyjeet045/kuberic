  name: kuberic-operator
  namespace: xedio
  labels:
    app: kuberic-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kuberic-operator
  template:
    metadata:
      labels:
        app: kuberic-operator
    spec:
      serviceAccountName: kuberic-operator
      containers:
      - name: operator
        image: localhost/kuberic-operator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 8081
        env:
        - name: RUST_LOG
          value: "info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
