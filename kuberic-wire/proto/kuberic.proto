syntax = "proto3";

package kuberic.level.v1;

message Epoch {
  int64 data_loss_number = 1;
  int64 configuration_number = 2;
}

enum ReplicaRole {
  REPLICA_ROLE_UNKNOWN = 0;
  REPLICA_ROLE_PRIMARY = 1;
  REPLICA_ROLE_ACTIVE_SECONDARY = 2;
  REPLICA_ROLE_IDLE_SECONDARY = 3;
  REPLICA_ROLE_NONE = 4;
}

enum AccessStatus {
  ACCESS_STATUS_UNKNOWN = 0;
  ACCESS_STATUS_GRANTED = 1;
  ACCESS_STATUS_RECONFIGURATION_PENDING = 2;
  ACCESS_STATUS_NOT_PRIMARY = 3;
  ACCESS_STATUS_NO_WRITE_QUORUM = 4;
}

enum AgentStorageState {
  AGENT_STORAGE_STATE_UNKNOWN = 0;
  AGENT_STORAGE_STATE_UNINITIALIZED = 1;
  AGENT_STORAGE_STATE_INITIALIZED = 2;
  AGENT_STORAGE_STATE_UNSAFE = 3;
}

enum TransitionKind {
  TRANSITION_KIND_UNKNOWN = 0;
  TRANSITION_KIND_BOOTSTRAP = 1;
  TRANSITION_KIND_REPLACEMENT = 2;
  TRANSITION_KIND_FAILOVER = 3;
  TRANSITION_KIND_PLANNED_SWITCHOVER = 4;
  TRANSITION_KIND_SECONDARY_SCALE_DOWN = 5;
  TRANSITION_KIND_SCALE_UP = 6;
}

enum FaultType {
  FAULT_TYPE_UNKNOWN = 0;
  FAULT_TYPE_TRANSIENT = 1;
  FAULT_TYPE_PERMANENT = 2;
}

message LoadMetric {
  string name = 1;
  int64 value = 2;
}

message BuildStatus {
  string build_id = 1;
  ReplicaIdentity target = 2;
  uint64 last_sequence = 3;
  int64 durable_lsn = 4;
  bool completed = 5;
  optional int64 catch_up_boundary_lsn = 6;
  int64 replication_boundary_lsn = 7;
}

message SwitchoverHandoff {
  string preparation_operation_id = 1;
  string request_id = 2;
  ReplicaIdentity source = 3;
  ReplicaIdentity target = 4;
  string starting_configuration_id = 5;
  int64 handoff_lsn = 6;
  Epoch starting_epoch = 7;
  uint64 preparation_generation = 8;
}

message SwitchoverPreparationId {
  string operation_id = 1;
  uint64 generation = 2;
}

message ReplicaIdentity {
  int64 replica_id = 1;
  string instance_id = 2;
  string agent_generation = 3;
}

message ConfigurationMember {
  ReplicaIdentity identity = 1;
  ReplicaRole role = 2;
}

message Configuration {
  string configuration_id = 1;
  Epoch epoch = 2;
  int64 primary_id = 3;
  repeated ConfigurationMember members = 4;
  uint32 write_quorum = 5;
}

message EffectivePolicy {
  uint32 replica_set_size = 1;
  uint32 write_quorum = 2;
  uint32 read_quorum = 3;
  uint64 failover_delay_seconds = 4;
}

message GetAgentStatusRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  int64 replica_id = 3;
  string expected_instance_id = 4;
}

message AgentStatusReport {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity identity = 3;
  string process_session_id = 4;
  uint64 report_sequence = 5;
  ReplicaRole role = 6;
  AccessStatus write_status = 7;
  Epoch epoch = 8;
  Configuration previous_configuration = 9;
  Configuration current_configuration = 10;
  int64 current_progress = 11;
  int64 committed_lsn = 12;
  optional int64 catch_up_capability = 13;
  AgentStorageState storage_state = 14;
  string pod_uid = 15;
  string pvc_uid = 16;
  string storage_error = 17;
  bool healthy = 18;
  int64 replica_id = 19;
  AccessStatus read_status = 20;
  int64 current_configuration_quorum_progress = 21;
  optional int64 catch_up_boundary = 22;
  bool catch_up_complete = 23;
  optional int64 deactivated_lsn = 24;
  repeated LoadMetric load_metrics = 25;
  FaultType reported_fault = 26;
  string pending_operation_id = 27;
  string retained_operation_id = 28;
  repeated BuildStatus builds = 29;
  Epoch deactivation_epoch = 30;
  optional int64 verified_replication_lsn = 31;
  SwitchoverHandoff prepared_switchover = 32;
  SecondaryRemovalPreparation prepared_secondary_removal = 33;
  SecondaryRemovalEvidence secondary_removal_evidence = 34;
  ReplicaRetirementReport retired_replica = 35;
  SecondaryScaleDownCleanup accepted_secondary_removal = 36;
  ScaleUpIntent scale_up_intent = 37;
  EnsureConfigurationCommand pending_configuration = 38;
}

message InitializeAgentStoreCommand {
  string initialization_id = 1;
  string resource_uid = 2;
  int64 local_replica_id = 3;
  string expected_instance_id = 4;
  string expected_pod_uid = 5;
  string expected_pvc_uid = 6;
  string assigned_agent_generation = 7;
  EffectivePolicy effective_policy = 8;
  Configuration bootstrap_configuration = 9;
  ProvisioningIntent provisioning = 10;
}

message ProvisioningIntent {
  reserved 1, 2, 4, 5, 8, 9, 11;
  oneof purpose {
    ReplicaIdentity replaces = 3;
    ScaleUpProvisioning scale_up = 12;
  }
  string pod_uid = 6;
  string pvc_uid = 7;
  string operation_id = 10;
}

message ScaleUpProvisioning {
  string resource_uid = 1;
  uint64 spec_generation = 2;
  uint32 desired_replicas = 3;
  Configuration previous_configuration = 4;
  EffectivePolicy previous_policy = 5;
  EffectivePolicy current_policy = 6;
  int64 target_replica_id = 7;
}

enum BuildAuthorityKind {
  BUILD_AUTHORITY_KIND_UNSPECIFIED = 0;
  BUILD_AUTHORITY_KIND_BOOTSTRAP = 1;
  BUILD_AUTHORITY_KIND_PROVISIONING = 2;
  BUILD_AUTHORITY_KIND_FAILOVER = 3;
}

message BuildAuthority {
  string build_id = 1;
  BuildAuthorityKind kind = 2;
  ReplicaIdentity source = 3;
  ReplicaIdentity target = 4;
  Configuration current_configuration = 5;
  int64 replication_boundary_lsn = 6;
}

message EnsureConfigurationCommand {
  string operation_id = 1;
  Configuration previous_configuration = 2;
  Configuration current_configuration = 3;
  Epoch previous_epoch = 4;
  Epoch current_epoch = 5;
  EffectivePolicy effective_policy = 6;
  int64 local_replica_id = 7;
  string expected_instance_id = 8;
  string expected_agent_generation = 9;
  TransitionKind transition_kind = 10;
  bool grant_write = 11;
  bool current_only = 12;
  string retire_build_id = 13;
  AccessStatus primary_write_status = 14;
  repeated string retire_build_ids = 15;
  optional int64 failover_safe_lsn = 16;
  SwitchoverHandoff switchover_handoff = 17;
  repeated SwitchoverPreparationId retire_switchover_preparation_ids = 18;
  EffectivePolicy previous_policy = 19;
  SecondaryRemovalEvidence secondary_removal_evidence = 20;
  ScaleUpConfigurationEvidence scale_up_evidence = 21;
}

message ScaleUpIntent {
  string operation_id = 1;
  string resource_uid = 2;
  uint64 spec_generation = 3;
  uint32 desired_replicas = 4;
  Configuration previous_configuration = 5;
  Configuration current_configuration = 6;
  EffectivePolicy previous_policy = 7;
  EffectivePolicy current_policy = 8;
  ReplicaIdentity primary = 9;
  ReplicaIdentity target = 10;
  string build_id = 11;
  int64 snapshot_boundary_lsn = 12;
  int64 catch_up_boundary_lsn = 13;
}

message ScaleUpWitness {
  string resource_uid = 1;
  ReplicaIdentity identity = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  string previous_configuration_id = 6;
  string current_configuration_id = 7;
  int64 verified_replication_lsn = 8;
  AccessStatus write_status = 9;
  string pending_operation_id = 10;
  string retained_operation_id = 11;
  ReplicaRole role = 12;
}

message ScaleUpFailoverEvidence {
  ScaleUpIntent intent = 1;
  repeated ScaleUpWitness previous_read_quorum = 2;
  repeated ScaleUpWitness current_read_quorum = 3;
  Configuration provisional_configuration = 4;
  ScaleUpFinalElectionEvidence final_election = 5;
}

message ScaleUpFinalWitness {
  int64 replica_id = 1;
  string process_session_id = 2;
  uint64 report_sequence = 3;
  int64 current_progress = 4;
  int64 committed_lsn = 5;
  int64 deactivated_lsn = 6;
  string fence_operation_id = 7;
}

message ScaleUpFinalElectionEvidence {
  int64 selected_primary_replica_id = 1;
  repeated ScaleUpFinalWitness witnesses = 2;
  repeated int64 previous_read_quorum = 3;
  repeated int64 current_read_quorum = 4;
}

message ScaleUpConfigurationEvidence {
  oneof evidence {
    ScaleUpIntent admission = 1;
    ScaleUpFailoverEvidence failover = 2;
  }
}

message ScaleUpCleanup {
  ProvisioningIntent provisioning = 1;
  ReplicaIdentity target = 2;
  ReplicaCleanupIdentity resources = 3;
}

message ScaleUpReceipt {
  ScaleUpIntent intent = 1;
  repeated ScaleUpWitness current_only_write_quorum = 2;
  Configuration accepted_configuration = 3;
  ScaleUpFailoverReceiptEvidence failover_evidence = 4;
  optional int64 failover_safe_lsn = 5;
}

message ScaleUpFailoverReceiptEvidence {
  int64 provisional_primary_replica_id = 1;
  repeated ScaleUpWitness previous_read_quorum = 2;
  repeated ScaleUpWitness current_read_quorum = 3;
  ScaleUpFinalElectionEvidence final_election = 4;
}

message CleanupResourceIdentity {
  string name = 1;
  oneof identity {
    string uid = 2;
    bool authoritatively_absent = 3;
  }
}

message ReplicaCleanupIdentity {
  CleanupResourceIdentity pod = 1;
  CleanupResourceIdentity pvc = 2;
  CleanupResourceIdentity endpoint = 3;
}

message SecondaryScaleDownIntent {
  string operation_id = 1;
  string resource_uid = 2;
  uint64 spec_generation = 3;
  uint32 desired_replicas = 4;
  Configuration previous_configuration = 5;
  Configuration current_configuration = 6;
  EffectivePolicy previous_policy = 7;
  EffectivePolicy current_policy = 8;
  ReplicaIdentity primary = 9;
  ReplicaIdentity target = 10;
  ReplicaCleanupIdentity cleanup = 11;
}

message SecondaryRemovalPreparation {
  SecondaryScaleDownIntent intent = 1;
  string operation_id = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  int64 boundary_lsn = 5;
}

message SecondaryRemovalWitness {
  string resource_uid = 1;
  ReplicaIdentity identity = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  string previous_configuration_id = 6;
  string current_configuration_id = 7;
  int64 verified_replication_lsn = 8;
  AccessStatus write_status = 9;
  string pending_operation_id = 10;
  string retained_operation_id = 11;
  ReplicaRole role = 12;
}

message SecondaryRemovalEvidence {
  SecondaryRemovalPreparation preparation = 1;
  repeated SecondaryRemovalWitness previous_read_quorum = 2;
  repeated SecondaryRemovalWitness reduced_write_quorum = 3;
}

message ReplicaRetirementReport {
  SecondaryScaleDownIntent intent = 1;
  string operation_id = 2;
  string process_session_id = 3;
  uint64 report_sequence = 4;
  Epoch epoch = 5;
  ReplicaRole role = 6;
  AccessStatus read_status = 7;
  AccessStatus write_status = 8;
  bool application_closed = 9;
  bool peers_fenced = 10;
}

message SecondaryScaleDownCleanup {
  SecondaryRemovalEvidence evidence = 1;
  repeated SecondaryRemovalWitness current_only_write_quorum = 2;
  ReplicaRetirementReport retirement = 3;
}

message PrepareSecondaryRemovalCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  SecondaryScaleDownIntent intent = 5;
}

message RetireReplicaCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  SecondaryScaleDownCleanup committed = 5;
}

message AcceptSecondaryRemovalCommitCommand {
  string operation_id = 1;
  ReplicaIdentity target = 2;
  SecondaryScaleDownCleanup committed = 3;
  bool local_recovery = 4;
}

message PrepareSwitchoverCommand {
  string operation_id = 1;
  string request_id = 2;
  int64 local_replica_id = 3;
  string expected_instance_id = 4;
  string expected_agent_generation = 5;
  ReplicaIdentity source = 6;
  ReplicaIdentity target = 7;
  Configuration current_configuration = 8;
  uint64 preparation_generation = 9;
}

message EnsureReplicaBuildCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  ReplicaIdentity target = 5;
  BuildAuthority authority = 6;
  string source_session_id = 7;
  bool retire = 8;
}

message ExecuteCommandRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity target = 3;
  string expected_process_session_id = 4;
  oneof command {
    InitializeAgentStoreCommand initialize_agent_store = 10;
    EnsureConfigurationCommand ensure_configuration = 11;
    EnsureReplicaBuildCommand ensure_replica_build = 12;
    PrepareSwitchoverCommand prepare_switchover = 13;
    PrepareSecondaryRemovalCommand prepare_secondary_removal = 14;
    RetireReplicaCommand retire_replica = 15;
    AcceptSecondaryRemovalCommitCommand accept_secondary_removal_commit = 16;
  }
}

message ExecuteCommandResponse {
  uint32 protocol_version = 1;
  AgentStatusReport observation = 2;
}

service AgentControl {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

service ReplicaPeer {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}
