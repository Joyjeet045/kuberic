[workspace]
resolver = "2"
members = [
  "kuberic-dex",
  "examples/kvstore2",
  "examples/postgres",
  "examples/sqlite",
  "kuberic-runtime",
  "kuberic-controller",
  "kuberic-level-tests",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic"
description = "Stateful replication framework for Kubernetes"
rust-version = "1.85"

[workspace.dependencies]
kuberic-controller = { version = "0.0.1", path = "kuberic-controller" }
kuberic-runtime = { version = "0.0.1", path = "kuberic-runtime", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
bytes = { version = "1", features = ["serde"] }
axum = "0.8"
base64 = "0.23"
futures = "0.3"
async-trait = "0.1"
serde = "1"
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
kube = { version = "4", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32", "schemars"] }
schemars = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
crc32fast = "1"
serial_test = "4.0.1"
tokio-postgres = "0.7"
test-log = { version = "0.2", default-features = false, features = ["trace"] }
whoami = "2"
uuid = "1"
