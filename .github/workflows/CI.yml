name: build

on: [push, pull_request]


env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kuberic-kind-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: kind-kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/kind-isolated-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated KinD ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Build and load Docker images
      run: just images

    - name: Run workspace tests
      run: cargo test --workspace --all-features -- --nocapture

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIND_CLUSTER_NAME: kuberic-gw-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kuberic-gateway-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: kind-kuberic-gw-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: gateway

    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0

    - name: Create dedicated Gateway KinD cluster
      uses: helm/kind-action@v1
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/gateway/kind-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated Gateway ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Build and load application images
      run: just images

    - name: Install pinned Gateway API and Envoy Gateway
      run: just gateway-install

    - name: Test shared authority routing and independent primary transitions
      run: just gateway-test

    - name: Collect Gateway diagnostics
      if: failure()
      run: just gateway-diagnostics > gateway-diagnostics.log 2>&1

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gateway-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: gateway-diagnostics.log
        if-no-files-found: ignore
