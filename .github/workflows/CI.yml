name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: ${{ github.workspace }}/target/kind/general-${{ github.run_id }}-${{ github.run_attempt }}.kubeconfig
      KUBE_CONTEXT: kind-kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt, clippy
        build-warnings: ""
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Prepare owned cluster directory
      run: mkdir -p "$(dirname "$KUBECONFIG")"

    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/kind-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated KinD ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Run workspace tests
      run: cargo test --workspace --all-features

    - name: Delete owned cluster
      if: always()
      timeout-minutes: 3
      run: |
        if test -f "${KUBECONFIG}.kuberic-owner"; then
          just delete-kind-cluster
        fi
