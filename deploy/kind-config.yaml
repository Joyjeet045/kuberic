# Canonical KinD cluster config for xedio workloads.
# NodePort mappings expose services to the host for dev/test access.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
        listenAddress: 127.0.0.1
        protocol: TCP
