[package]
name = "sqlite-replicated"
version.workspace = true
edition.workspace = true
publish = false

[features]
testing = ["kuberic-agent/testing", "dep:kuberic-runtime-internal", "dep:kuberic-wire", "dep:tempfile"]

[[bin]]
name = "sqlite-replicated"
path = "src/main.rs"

[dependencies]
kuberic-agent = { path = "../../kuberic-agent" }
kuberic-protocol = { path = "../../kuberic-protocol" }
kuberic-runtime = { path = "../../kuberic-runtime" }
kuberic-runtime-internal = { path = "../../kuberic-runtime-internal", optional = true }
kuberic-wire = { path = "../../kuberic-wire", optional = true }
tempfile = { version = "3", optional = true }
async-trait.workspace = true
futures.workspace = true
sqlite-commit-barrier = { path = "../../sqlite-commit-barrier" }
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
tonic.workspace = true
prost.workspace = true
tonic-prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
crc32fast.workspace = true

[dev-dependencies]
sqlite-replicated = { path = ".", features = ["testing"] }
tempfile = "3"

[build-dependencies]
tonic-prost-build.workspace = true
