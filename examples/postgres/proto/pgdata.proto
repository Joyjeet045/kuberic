syntax = "proto3";
package pgdata.v2;

// The bounded canonical JSON envelopes are versioned and strictly decoded:
// unknown, duplicate, missing, noncanonical, and oversized values are rejected.
// This is coordination only; PostgreSQL owns physical WAL and backup transport.
service PgDataService {
  rpc Build(NativeBuildRequest) returns (NativeBuildResponse);
  rpc InspectSource(NativeBuildRequest) returns (NativeSourceResponse);
  rpc Recover(RecoveryRequest) returns (RecoveryResponse);
}

message RecoveryRequest { bytes envelope_json = 1; }
message RecoveryResponse { bytes envelope_json = 1; }
message NativeBuildRequest {
  bytes envelope_json = 1;
}
message NativeBuildResponse {
  bytes progress_json = 1;
}
message NativeSourceResponse {
  bytes lineage_json = 1;
}
