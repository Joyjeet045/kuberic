[package]
name = "kuberic-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Independent level-triggered application and replication runtime for Kuberic"
readme = "README.md"

[features]
default = ["host"]
host = ["dep:rusqlite", "dep:serde_json", "dep:tokio-stream", "dep:tracing"]
testing = ["host"]
native = ["dep:serde_json"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
prost.workspace = true
rusqlite = { workspace = true, optional = true }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"], optional = true }
tonic.workspace = true
tonic-prost.workspace = true
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
# Repository-only cross-crate proofs; Cargo omits unversioned dev paths on publication.
kuberic-controller = { path = "../kuberic-controller", features = ["runtime-test-bridge"] }
quote = "1"
rusqlite.workspace = true
serde_json.workspace = true
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"
